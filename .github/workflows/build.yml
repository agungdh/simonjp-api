name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            goamd64: v2
            goarm64: ""
            output: bin/api-linux-amd64v2
          - goarch: arm64
            goamd64: ""
            goarm64: v8.0
            output: bin/api-linux-arm64
    env:
      GOOS: linux
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build (${{ matrix.goarch }})
        env:
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM64: ${{ matrix.goarm64 }}
        run: go build -o ${{ matrix.output }} ./cmd/api

      - name: Upload binary (${{ matrix.goarch }})
        uses: actions/upload-artifact@v4
        with:
          name: api-linux-${{ matrix.goarch }}
          path: ${{ matrix.output }}
